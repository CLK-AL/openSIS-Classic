version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opensis-app
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-opensis}
      - DB_PASS=${DB_PASS:-opensis_secret}
      - DB_NAME=${DB_NAME:-opensis}
    volumes:
      - app-uploads:/var/www/html/tmp
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - opensis-net

  db:
    image: mysql:8.0
    container_name: opensis-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_secret}
      MYSQL_DATABASE: ${DB_NAME:-opensis}
      MYSQL_USER: ${DB_USER:-opensis}
      MYSQL_PASSWORD: ${DB_PASS:-opensis_secret}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --sql-mode=NO_ENGINE_SUBSTITUTION
      --event-scheduler=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASS:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - opensis-net

volumes:
  db-data:
  app-uploads:

networks:
  opensis-net:
    driver: bridge
